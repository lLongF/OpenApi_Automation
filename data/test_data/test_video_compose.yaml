    - id: "VCMP_EXCEPTION_009"
      title: "视频压制合成-缺少自定义字幕位置"
      category: "negative"
      files:
        video_file: "valid_video"
        audio_file: "valid_audio"
        subtitle_file: "valid_subtitle"
      params:
        target_language: "zh"
        subtitle_x: 50
      expected:
        http_status_any: [ 200, 400, 422, 500 ]
        code: 1001
        message_contains_any: [ "如需使用自定义字幕位置，必须同时传subtitle_x、subtitle_y、subtitle_font_size、coordinate_width、coordinate_height", "subtitle_y", "subtitle_font_size", "coordinate_width", "coordinate_height" ]
