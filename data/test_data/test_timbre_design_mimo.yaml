# 接口名称：MIMO 音色设计接口
# 接口路径：POST /open/timbre-design/generate-mimo
# 请求方式：application/json
# 请求字段：text（待合成文本）、description（音色描述）、optimize_text（是否优化文本）。
# OpenAPI 未声明文本长度上限；本组覆盖正向、异常、最小边界、等价类与组合场景。

timbre_design_mimo:
  cases:
    - id: "TDM_POS_001"
      title: "MIMO音色设计-完整合法请求"
      category: "positive"
      technique: "positive"
      json:
        text: "你好，欢迎收听今天的节目。"
        description: "年轻女性，声音清澈活泼。"
        optimize_text: true
      expected:
        http_status: 200
        code: 200
    - id: "TDM_EQ_001"
      title: "MIMO音色设计-关闭文本优化等价类"
      category: "positive"
      technique: "equivalence"
      json:
        text: "这是一段不需要优化的测试文本。"
        description: "沉稳男声，适合新闻播报。"
        optimize_text: false
      expected:
        http_status: 200
        code: 200
    - id: "TDM_BND_001"
      title: "MIMO音色设计-单字符文本最小边界"
      category: "boundary"
      technique: "boundary"
      json:
        text: "好"
        description: "女"
        optimize_text: true
      expected:
        http_status: 200
        code: 200
    - id: "TDM_SCN_001"
      title: "MIMO音色设计-播客旁白描述结合文本优化场景"
      category: "positive"
      technique: "scenario"
      json:
        text: "夜色渐深，让我们在安静的故事里慢慢入睡。"
        description: "温柔、低沉的女性播客旁白，语速舒缓，适合睡前故事。"
        optimize_text: true
      expected:
        http_status: 200
        code: 200
    - id: "TDM_NEG_001"
      title: "MIMO音色设计-缺少文本"
      category: "negative"
      technique: "equivalence"
      json:
        description: "年轻女性，声音清澈活泼。"
        optimize_text: true
      expected:
        http_status_any: [200, 400, 422, 500]
        code_any: [400, 422, 1001, 1002]
        message_contains_any: ["text", "文本", "必填", "不能为空", "缺少"]
    - id: "TDM_NEG_002"
      title: "MIMO音色设计-文本为空字符串"
      category: "negative"
      technique: "equivalence"
      json:
        text: ""
        description: "年轻女性，声音清澈活泼。"
        optimize_text: true
      expected:
        http_status_any: [200, 400, 422, 500]
        code_any: [400, 422, 1001, 1002]
        message_contains_any: ["text", "文本", "必填", "不能为空"]
